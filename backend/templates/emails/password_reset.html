<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Reset Password</title></head>
<body style="font-family:Inter,sans-serif;background:#f8fafc;padding:40px 0;">
  <div style="max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:40px;border:1px solid #e2e8f0;">
    <h2 style="color:#1e293b;margin-bottom:8px;">Reset your password</h2>
    <p style="color:#64748b;">Hi {{ user.full_name }},</p>
    <p style="color:#64748b;">Click the button below to reset your Kitayi Solutions account password.</p>
    <a href="{{ reset_link }}" style="display:inline-block;background:#0a84ff;color:#fff;padding:12px 28px;border-radius:10px;text-decoration:none;font-weight:700;margin:16px 0;">Reset Password</a>
    <p style="color:#94a3b8;font-size:13px;margin-top:24px;">This link expires in 15 minutes. If you did not request a reset, please ignore this email.</p>
  </div>
</body>
</html>
